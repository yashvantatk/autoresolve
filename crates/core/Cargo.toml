[package]
name = "autoresolve-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
globset = "0.4.20"
ignore = "0.4.33"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
streaming-iterator = "0.1.9"
tokio = { version = "1.53.1", features = ["time"] }
toml = "1.1.6"
tree-sitter = "0.27.0"
tree-sitter-python = "0.25.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }
